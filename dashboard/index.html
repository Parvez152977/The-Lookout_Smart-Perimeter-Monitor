<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>The Lookout — Smart Perimeter Monitor</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #0a0f1a 0%, #0c1220 100%);
                color: #eef2ff;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
                padding: 20px;
                min-height: 100vh;
            }

            /* Container */
            .container {
                max-width: 1400px;
                margin: 0 auto;
            }

            /* Header */
            .header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                flex-wrap: wrap;
                gap: 16px;
                margin-bottom: 32px;
                padding-bottom: 20px;
                border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            }

            .title-section h1 {
                font-size: 2.2rem;
                font-weight: 700;
                background: linear-gradient(135deg, #60a5fa, #a855f7);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                letter-spacing: -0.5px;
            }

            .title-section .sub {
                font-size: 0.85rem;
                color: #6b7280;
                margin-top: 6px;
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }

            .badge {
                background: rgba(59, 130, 246, 0.2);
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 0.7rem;
                font-weight: 500;
                color: #60a5fa;
                border: 1px solid rgba(59, 130, 246, 0.4);
            }

            .stats {
                background: rgba(15, 25, 35, 0.8);
                backdrop-filter: blur(4px);
                padding: 12px 24px;
                border-radius: 24px;
                display: flex;
                gap: 32px;
                flex-wrap: wrap;
                border: 1px solid #1e2a3a;
            }

            .stat {
                text-align: center;
            }

            .stat-value {
                font-size: 1.8rem;
                font-weight: 700;
                color: #60a5fa;
            }

            .stat-label {
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #8b9bb0;
            }

            /* Controls Bar */
            .controls {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 16px;
                margin-bottom: 24px;
                background: #0f1622;
                padding: 12px 20px;
                border-radius: 20px;
                border: 1px solid #1e2a3a;
            }

            .refresh-control {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .refresh-btn {
                background: #1e2a3a;
                border: none;
                color: #eef2ff;
                padding: 8px 20px;
                border-radius: 40px;
                cursor: pointer;
                font-size: 0.85rem;
                font-weight: 500;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .refresh-btn:hover {
                background: #2d3a4a;
                transform: scale(0.98);
            }

            .auto-refresh {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.8rem;
                color: #9ca3af;
            }

            .auto-refresh input {
                width: 40px;
                background: #1e2a3a;
                border: 1px solid #334155;
                color: white;
                padding: 6px;
                border-radius: 8px;
                text-align: center;
            }

            .clear-btn {
                background: rgba(239, 68, 68, 0.15);
                border: 1px solid rgba(239, 68, 68, 0.4);
                color: #f87171;
                padding: 8px 18px;
                border-radius: 40px;
                cursor: pointer;
                font-size: 0.8rem;
                transition: all 0.2s;
            }

            .clear-btn:hover {
                background: rgba(239, 68, 68, 0.3);
            }

            /* Status Message */
            .status {
                background: #0f1622;
                padding: 12px 20px;
                border-radius: 16px;
                margin-bottom: 24px;
                font-size: 0.85rem;
                border-left: 4px solid #60a5fa;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
            }

            .status.online {
                border-left-color: #22c55e;
            }

            .status.offline {
                border-left-color: #ef4444;
            }

            .last-update {
                font-size: 0.7rem;
                color: #6b7280;
            }

            /* Image Grid */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 20px;
                margin-top: 8px;
            }

            .card {
                background: #0f1622;
                border-radius: 20px;
                overflow: hidden;
                border: 1px solid #1e2a3a;
                transition: all 0.25s ease;
                cursor: pointer;
                animation: fadeInUp 0.3s ease;
            }

            .card:hover {
                transform: translateY(-4px);
                border-color: #3b82f6;
                box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.5);
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .card-img {
                width: 100%;
                aspect-ratio: 4 / 3;
                object-fit: cover;
                background: #0a0e16;
                display: block;
            }

            .card-info {
                padding: 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-top: 1px solid #1a2436;
            }

            .timestamp {
                font-size: 0.7rem;
                color: #8b9bb0;
                font-family: 'JetBrains Mono', monospace;
            }

            .event-id {
                font-size: 0.6rem;
                background: #1a2436;
                padding: 2px 8px;
                border-radius: 20px;
                color: #6b7280;
            }

            /* Modal */
            .modal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.92);
                backdrop-filter: blur(12px);
                align-items: center;
                justify-content: center;
                z-index: 1000;
                cursor: pointer;
            }

            .modal.open {
                display: flex;
            }

            .modal-content {
                max-width: 90vw;
                max-height: 90vh;
                position: relative;
            }

            .modal-content img {
                max-width: 100%;
                max-height: 85vh;
                border-radius: 20px;
                box-shadow: 0 25px 50px -12px black;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .modal-caption {
                text-align: center;
                margin-top: 16px;
                color: #ccc;
                font-size: 0.8rem;
            }

            .close-modal {
                position: absolute;
                top: -40px;
                right: 0;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 20px;
            }

            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 80px 20px;
                color: #4b5563;
            }

            .empty-state svg {
                width: 80px;
                opacity: 0.4;
                margin-bottom: 16px;
            }

            /* Loading skeleton */
            .skeleton {
                background: #111827;
                border-radius: 20px;
                height: 220px;
                animation: pulse 1.5s infinite;
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 0.4;
                }

                50% {
                    opacity: 0.7;
                }
            }

            /* Responsive */
            @media (max-width: 640px) {
                body {
                    padding: 12px;
                }

                .stats {
                    padding: 8px 16px;
                    gap: 16px;
                }

                .stat-value {
                    font-size: 1.2rem;
                }

                .title-section h1 {
                    font-size: 1.5rem;
                }

                .grid {
                    gap: 12px;
                    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                }
            }
        </style>
    </head>

    <body>

        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="title-section">
                    <h1>🔭 The Lookout</h1>
                    <div class="sub">
                        <span>smart perimeter monitor</span>
                        <span class="badge">⚡ live motion alerts</span>
                        <span class="badge">📸 Telegram vision</span>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="eventCount">0</div>
                        <div class="stat-label">events</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="lastHourCount">0</div>
                        <div class="stat-label">last hour</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="uniqueDays">0</div>
                        <div class="stat-label">days active</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="refresh-control">
                    <button class="refresh-btn" id="manualRefresh">⟳ Refresh now</button>
                    <div class="auto-refresh">
                        <span>🔄 auto</span>
                        <input type="number" id="refreshInterval" value="5" step="1" min="1" max="30">
                        <span>sec</span>
                    </div>
                </div>
                <button class="clear-btn" id="clearLocalBtn">🗑 Clear preview cache</button>
            </div>

            <!-- Status bar -->
            <div class="status" id="statusBar">
                <span id="statusText">🟢 Loading events...</span>
                <span class="last-update" id="lastUpdateText">—</span>
            </div>

            <!-- Grid / Feed -->
            <div id="gridContainer">
                <div class="grid" id="imageGrid">
                    <div class="skeleton"></div>
                    <div class="skeleton"></div>
                    <div class="skeleton"></div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="close-modal" onclick="closeModal()">✕</div>
                <img id="modalImage" src="" alt="Preview">
                <div class="modal-caption" id="modalCaption"></div>
            </div>
        </div>

        <script>
            // ---------- DOM elements ----------
            const gridEl = document.getElementById('imageGrid');
            const eventCountSpan = document.getElementById('eventCount');
            const lastHourCountSpan = document.getElementById('lastHourCount');
            const uniqueDaysSpan = document.getElementById('uniqueDays');
            const statusTextSpan = document.getElementById('statusText');
            const lastUpdateSpan = document.getElementById('lastUpdateText');
            const manualBtn = document.getElementById('manualRefresh');
            const clearLocalBtn = document.getElementById('clearLocalBtn');
            const intervalInput = document.getElementById('refreshInterval');

            let refreshTimer = null;
            let currentEvents = [];      // store latest events for stats

            // Helper: format timestamp nicely
            function formatTime(isoString) {
                const date = new Date(isoString);
                return date.toLocaleString(undefined, {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            }

            // Compute stats from events array
            function updateStats(events) {
                const total = events.length;
                const now = new Date();
                const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
                const lastHour = events.filter(e => new Date(e.timestamp) > oneHourAgo).length;

                // unique days (based on date YYYY-MM-DD)
                const uniqueDates = new Set();
                events.forEach(e => {
                    const d = new Date(e.timestamp).toISOString().split('T')[0];
                    uniqueDates.add(d);
                });

                eventCountSpan.innerText = total;
                lastHourCountSpan.innerText = lastHour;
                uniqueDaysSpan.innerText = uniqueDates.size || '—';
            }

            // Render grid
            function renderGrid(events) {
                if (!events || events.length === 0) {
                    gridEl.innerHTML = `<div class="empty-state">
                <div>📭</div>
                <div style="margin-top: 12px;">No motion events yet.<br>Trigger the PIR sensor to see images.</div>
            </div>`;
                    return;
                }

                gridEl.innerHTML = events.map(event => `
            <div class="card" onclick="openModal('${event.url}', '${formatTime(event.timestamp)}', '${event.id}')">
                <img class="card-img" src="${event.url}" loading="lazy" alt="Motion capture" 
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23333%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23111%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%23666%22%3E⚠️ failed%3C/text%3E%3C/svg%3E'">
                <div class="card-info">
                    <span class="timestamp">🕒 ${formatTime(event.timestamp)}</span>
                    <span class="event-id">#${event.id}</span>
                </div>
            </div>
        `).join('');
            }

            // Fetch events from backend
            async function loadEvents(showLoading = true) {
                try {
                    if (showLoading) {
                        statusTextSpan.innerHTML = "⏳ Fetching from server...";
                        statusTextSpan.parentElement.classList.remove('online', 'offline');
                    }

                    const response = await fetch('/events');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const events = await response.json();
                    currentEvents = events;   // store for stats

                    // update stats + grid
                    updateStats(events);
                    renderGrid(events);

                    // update status bar
                    statusTextSpan.innerHTML = events.length > 0 ? "🟢 LIVE — perimeter active" : "🟡 Awaiting first motion";
                    statusTextSpan.parentElement.classList.add('online');
                    statusTextSpan.parentElement.classList.remove('offline');

                    const now = new Date();
                    lastUpdateSpan.innerText = `last update: ${now.toLocaleTimeString()}`;

                } catch (error) {
                    console.error("Failed to load events:", error);
                    statusTextSpan.innerHTML = "🔴 Cannot reach backend — is server running?";
                    statusTextSpan.parentElement.classList.add('offline');
                    statusTextSpan.parentElement.classList.remove('online');
                    gridEl.innerHTML = `<div class="empty-state">
                <div>⚠️</div>
                <div>Backend unreachable.<br>Make sure FastAPI is running on port 8000.</div>
            </div>`;
                    eventCountSpan.innerText = '0';
                    lastHourCountSpan.innerText = '0';
                    uniqueDaysSpan.innerText = '0';
                }
            }

            // Auto-refresh setup
            function startAutoRefresh() {
                if (refreshTimer) clearInterval(refreshTimer);
                const intervalSec = parseInt(intervalInput.value, 10);
                if (isNaN(intervalSec) || intervalSec < 1) return;
                refreshTimer = setInterval(() => {
                    loadEvents(false);
                }, intervalSec * 1000);
            }

            function restartAutoRefresh() {
                startAutoRefresh();
            }

            // Modal handling
            window.openModal = function (url, timestamp, eventId) {
                const modal = document.getElementById('modal');
                const modalImg = document.getElementById('modalImage');
                const modalCaption = document.getElementById('modalCaption');
                modalImg.src = url;
                modalCaption.innerHTML = `📸 Event #${eventId} · ${timestamp}`;
                modal.classList.add('open');
            };

            window.closeModal = function () {
                document.getElementById('modal').classList.remove('open');
            };

            // clear local image cache (by reloading grid with cache-bust)
            function clearPreviewCache() {
                // Force refresh images by appending a timestamp param to each image url (no backend change)
                if (currentEvents.length === 0) {
                    loadEvents(true);
                    return;
                }
                const bustedEvents = currentEvents.map(ev => ({
                    ...ev,
                    url: ev.url.includes('?') ? ev.url + '&_cb=' + Date.now() : ev.url + '?_cb=' + Date.now()
                }));
                renderGrid(bustedEvents);
                statusTextSpan.innerHTML = "🗑 Cache cleared + images reloaded";
                setTimeout(() => {
                    if (currentEvents.length > 0) statusTextSpan.innerHTML = "🟢 LIVE — perimeter active";
                    else statusTextSpan.innerHTML = "🟡 Awaiting first motion";
                }, 1500);
            }

            // Event listeners
            manualBtn.addEventListener('click', () => loadEvents(true));
            clearLocalBtn.addEventListener('click', clearPreviewCache);
            intervalInput.addEventListener('change', () => {
                startAutoRefresh();
            });

            // Escape key closes modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            // initial load
            loadEvents(true);
            startAutoRefresh();
        </script>
    </body>

</html>
